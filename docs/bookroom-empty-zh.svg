<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">Study Reader 空白书房</title>
  <desc id="desc">没有文献、文件夹或用户数据的空白书房界面示意图。</desc>
  <rect width="1440" height="820" fill="#f7f9fc"/>
  <rect x="0" y="0" width="1440" height="64" fill="#ffffff" stroke="#dfe5ef"/>
  <rect x="20" y="16" width="34" height="34" rx="9" fill="#5b5ce2"/>
  <text x="37" y="39" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#fff">SR</text>
  <text x="66" y="31" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#182033">Study Reader</text>
  <text x="66" y="49" font-family="system-ui,sans-serif" font-size="12" fill="#778196">文献与提示词注入工作台</text>
  <rect x="649" y="10" width="142" height="44" rx="15" fill="#eef3f8"/>
  <rect x="716" y="14" width="70" height="36" rx="12" fill="#fff" stroke="#cfd8e6"/>
  <text x="682" y="38" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#667085">对话</text>
  <text x="751" y="38" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#356ae6">书房</text>

  <rect x="0" y="64" width="270" height="756" fill="#f2f6fb" stroke="#dfe5ef"/>
  <text x="24" y="105" font-family="system-ui,sans-serif" font-size="23" font-weight="700" fill="#182033">书房</text>
  <text x="24" y="129" font-family="system-ui,sans-serif" font-size="14" fill="#778196">文献与助手设置</text>
  <rect x="18" y="163" width="234" height="64" rx="12" fill="#e5ebf3"/>
  <text x="34" y="190" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#356ae6">总览</text>
  <text x="34" y="211" font-family="system-ui,sans-serif" font-size="12" fill="#778196">本次对话正在使用什么</text>
  <text x="24" y="270" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#778196">文献库</text>
  <text x="34" y="307" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#182033">全部文献</text>
  <text x="34" y="329" font-family="system-ui,sans-serif" font-size="12" fill="#778196">导入、整理与预览</text>
  <text x="24" y="390" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#778196">助手设置</text>
  <text x="34" y="428" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#182033">配置预设</text>
  <text x="34" y="477" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#182033">提示词注入</text>
  <text x="34" y="526" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#182033">Skills</text>
  <text x="34" y="575" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#182033">Tools</text>
  <text x="24" y="640" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#778196">连接与权限</text>
  <text x="34" y="678" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#182033">访问权限</text>
  <text x="34" y="727" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#182033">服务连接</text>

  <rect x="292" y="86" width="1124" height="710" rx="22" fill="#fff" stroke="#dfe5ef"/>
  <text x="334" y="137" font-family="system-ui,sans-serif" font-size="27" font-weight="700" fill="#182033">文献库</text>
  <text x="334" y="165" font-family="system-ui,sans-serif" font-size="15" fill="#778196">导入 PDF 或 EPUB，然后在这里整理、预览并选择对话可用的文献。</text>
  <rect x="1223" y="111" width="150" height="46" rx="12" fill="#356ae6"/>
  <text x="1298" y="140" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#fff">导入文献</text>
  <line x1="334" y1="196" x2="1374" y2="196" stroke="#e7ebf1"/>
  <rect x="334" y="226" width="350" height="48" rx="12" fill="#fff" stroke="#cfd8e6"/>
  <text x="355" y="256" font-family="system-ui,sans-serif" font-size="15" fill="#98a2b3">搜索标题或作者</text>
  <rect x="334" y="310" width="1040" height="410" rx="18" fill="#f8fafc" stroke="#e2e8f0" stroke-dasharray="6 7"/>
  <circle cx="854" cy="431" r="42" fill="#e8efff"/>
  <path d="M834 416h40v34h-40z M840 410h28v8h-28z" fill="none" stroke="#356ae6" stroke-width="4" stroke-linejoin="round"/>
  <text x="854" y="502" text-anchor="middle" font-family="system-ui,sans-serif" font-size="23" font-weight="700" fill="#182033">还没有文献</text>
  <text x="854" y="537" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#778196">导入第一份 PDF 或 EPUB 开始使用书房</text>
  <rect x="779" y="570" width="150" height="44" rx="11" fill="#fff" stroke="#356ae6"/>
  <text x="854" y="598" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#356ae6">选择文件</text>
</svg>
